[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "et-rcm"
version = "0.1.0"
description = "Endogenous-Time Readout-Conserving Memory Model research prototype"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "pandas>=2.0",
  "pyarrow>=14",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

